[package]
name = "poker-server"
version = "0.1.0"
edition = "2024"

[dependencies]
poker-shared = {path = "../poker-shared"}

axum = { version = "0.8" }
tokio = { version = "1", features = ["full"]}
clap = { version = "4", features = ["derive"] }
colog = { version = "1"}
log = { version = "0.4" }
chrono = { version = "0.4" }
serde = { version = "1.0", features = ["derive"]}
